<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Word Predictor</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(83, 70, 255, 0.28),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 10%,
                    rgba(0, 220, 255, 0.18),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #040611,
                    #0a1028,
                    #040611
                );
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width: 92%;

            max-width: 1200px;

            margin: auto;

            padding-top: 45px;

            padding-bottom: 60px;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero {

            padding: 38px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.09),
                    rgba(255,255,255,0.025)
                );

            border: 1px solid
                rgba(255,255,255,0.13);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.45),

                inset 0 1px 0
                rgba(255,255,255,0.08);

            backdrop-filter: blur(20px);
        }


        .badge {

            display: inline-block;

            padding: 9px 17px;

            border-radius: 30px;

            font-size: 12px;

            letter-spacing: 1.5px;

            color: #72eaff;

            background:
                rgba(0,220,255,0.10);

            border: 1px solid
                rgba(0,220,255,0.25);
        }


        .hero h1 {

            margin-top: 18px;

            font-size: 52px;

            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #8be9ff,
                    #9b8cff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color:
                transparent;
        }


        .hero p {

            margin-top: 12px;

            font-size: 17px;

            color: #aab4d1;

            line-height: 1.7;
        }


        /* =========================================
           MAIN GRID
        ========================================= */

        .main-grid {

            display: grid;

            grid-template-columns:
                1.1fr 1fr;

            gap: 28px;

            margin-top: 28px;
        }


        /* =========================================
           GLASS CARD
        ========================================= */

        .card {

            padding: 30px;

            border-radius: 26px;

            background:
                rgba(255,255,255,0.055);

            border: 1px solid
                rgba(255,255,255,0.11);

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.35),

                inset 0 1px 0
                rgba(255,255,255,0.05);

            backdrop-filter: blur(18px);
        }


        .card-title {

            font-size: 22px;

            margin-bottom: 25px;

            font-weight: 700;
        }


        /* =========================================
           INPUT
        ========================================= */

        .input-group {

            margin-bottom: 22px;
        }


        .input-group label {

            display: block;

            margin-bottom: 9px;

            font-size: 14px;

            color: #aeb9d8;
        }


        .input-group input {

            width: 100%;

            padding: 15px 17px;

            border-radius: 14px;

            border: 1px solid
                rgba(255,255,255,0.13);

            outline: none;

            background:
                rgba(255,255,255,0.06);

            color: white;

            font-size: 16px;

            transition: 0.3s;
        }


        .input-group input:focus {

            border-color:
                rgba(91,220,255,0.65);

            box-shadow:
                0 0 20px
                rgba(50,180,255,0.12);
        }


        /* =========================================
           BUTTON
        ========================================= */

        .generate-btn {

            width: 100%;

            padding: 16px;

            margin-top: 5px;

            border: none;

            border-radius: 15px;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #5546e8,
                    #087fa5
                );

            box-shadow:
                0 12px 35px
                rgba(60,80,255,0.30);

            transition: 0.3s;
        }


        .generate-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 18px 45px
                rgba(50,160,255,0.45);
        }


        /* =========================================
           3D BALL
        ========================================= */

        .visual-card {

            min-height: 430px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }


        .orb-container {

            width: 280px;

            height: 280px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;
        }


        .orb {

            width: 175px;

            height: 175px;

            border-radius: 50%;

            position: relative;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #ffffff 0%,
                    #8cefff 7%,
                    #5965ff 28%,
                    #312873 55%,
                    #080a25 82%
                );

            box-shadow:

                0 0 25px
                rgba(80,100,255,0.95),

                0 0 75px
                rgba(60,100,255,0.60),

                inset -30px -30px 45px
                rgba(0,0,0,0.65);

            animation:
                floatOrb 4s
                ease-in-out
                infinite;
        }


        .orb-ring {

            position: absolute;

            width: 240px;

            height: 80px;

            border-radius: 50%;

            border: 1px solid
                rgba(90,220,255,0.45);

            transform:
                rotate(-25deg);

            animation:
                rotateRing 6s
                linear
                infinite;
        }


        .orb-ring.two {

            width: 260px;

            height: 90px;

            border-color:
                rgba(150,100,255,0.35);

            transform:
                rotate(55deg);

            animation-duration: 8s;
        }


        @keyframes floatOrb {

            0%, 100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-17px);
            }
        }


        @keyframes rotateRing {

            from {

                transform:
                    rotate(0deg);
            }

            to {

                transform:
                    rotate(360deg);
            }
        }


        .visual-title {

            margin-top: 15px;

            font-size: 21px;

            font-weight: 700;
        }


        .visual-subtitle {

            margin-top: 8px;

            color: #8e9ab9;

            font-size: 14px;
        }


        /* =========================================
           RESULT
        ========================================= */

        .result-card {

            margin-top: 28px;

            padding: 30px;

            border-radius: 26px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,220,255,0.08),
                    rgba(100,70,255,0.08)
                );

            border: 1px solid
                rgba(100,220,255,0.20);

            box-shadow:
                0 20px 55px
                rgba(0,0,0,0.3);

            display: none;
        }


        .result-title {

            color: #75e8ff;

            font-size: 13px;

            letter-spacing: 1px;

            font-weight: 700;

            margin-bottom: 10px;
        }


        .token-info {

            color: #909cc0;

            font-size: 13px;

            margin-bottom: 17px;
        }


        .result-text {

            font-size: 20px;

            line-height: 1.9;

            color: #f4f7ff;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            text-align: center;

            margin-top: 45px;

            color: #68728f;

            font-size: 13px;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media(max-width: 800px) {

            .main-grid {

                grid-template-columns: 1fr;
            }

            .hero h1 {

                font-size: 38px;
            }

            .container {

                width: 94%;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================================
         HERO
    ========================================== -->

    <section class="hero">

        <span class="badge">
            ✦ AI • NLP • DEEP LEARNING
        </span>

        <h1>
            AI Word Predictor
        </h1>

        <p>
            Intelligent next-word prediction
            powered by Natural Language Processing
            and Deep Learning.
        </p>

    </section>


    <!-- =========================================
         MAIN
    ========================================== -->

    <section class="main-grid">


        <!-- PREDICTION CARD -->

        <div class="card">

            <div class="card-title">
                ✦ Prediction Engine
            </div>


            <div class="input-group">

                <label>
                    Starting Word
                </label>

                <input
                    type="text"
                    id="startWord"
                    autocomplete="off"
                >

            </div>


            <div class="input-group">

                <label>
                    Number of Tokens
                </label>

                <input
                    type="number"
                    id="tokenCount"
                    min="1"
                    value="20"
                >

            </div>


            <button
                class="generate-btn"
                onclick="generatePrediction()"
            >
                ⚡ Generate Prediction
            </button>

        </div>


        <!-- 3D CARD -->

        <div class="card visual-card">

            <div class="orb-container">

                <div class="orb">

                    <div class="orb-ring"></div>

                    <div class="orb-ring two"></div>

                </div>

            </div>


            <div class="visual-title">
                Neural Prediction Core
            </div>

            <div class="visual-subtitle">
                LSTM-powered language intelligence
            </div>

        </div>

    </section>


    <!-- =========================================
         RESULT
    ========================================== -->

    <section
        class="result-card"
        id="resultCard"
    >

        <div class="result-title">
            ✦ GENERATED TEXT
        </div>

        <div
            class="token-info"
            id="tokenInfo"
        ></div>

        <div
            class="result-text"
            id="resultText"
        ></div>

    </section>


    <div class="footer">

        AI Word Predictor •
        NLP & Deep Learning Project

    </div>


</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>

async function generatePrediction() {

    const startWord =
        document
        .getElementById("startWord")
        .value
        .trim();

    const tokenCount =
        document
        .getElementById("tokenCount")
        .value;


    if (startWord === "") {

        alert(
            "Please enter a starting word."
        );

        return;
    }


    if (tokenCount < 1) {

        alert(
            "Please enter a valid number of tokens."
        );

        return;
    }


    const button =
        document.querySelector(
            ".generate-btn"
        );

    button.innerText =
        "⏳ Generating...";

    button.disabled = true;


    try {

        const response =
            await fetch(
                "http://127.0.0.1:5000/predict",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        start_word:
                            startWord,

                        tokens:
                            Number(tokenCount)

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Prediction failed."
            );

            return;
        }


        document
        .getElementById("resultCard")
        .style.display = "block";


        document
        .getElementById("tokenInfo")
        .innerText =
            "Tokens generated: "
            + data.tokens;


        document
        .getElementById("resultText")
        .innerText =
            data.text;

    }


    catch (error) {

        alert(
            "API connection failed. Make sure app.py is running."
        );

    }


    finally {

        button.innerText =
            "⚡ Generate Prediction";

        button.disabled = false;

    }

}

</script>


</body>

</html>
